name: Discovery de vagas

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6h; cada fonte respeita o próprio poll_interval_hours internamente
  workflow_dispatch: {}       # permite disparo manual pela aba Actions

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r automacao/requirements.txt

      - name: Rodar pipeline (discovery -> score -> notificação)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -m automacao.pipeline.run

      # Runners do Actions são efêmeros — o SQLite precisa ser commitado de volta
      # para persistir entre execuções.
      - name: Commitar jobs.db atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automacao/data/jobs.db
          git diff --cached --quiet || git commit -m "chore: atualiza índice de vagas (discovery automático)"
          git push
